services:
  system-agent:
    image: yagatito/system-agent-${PLATFORM_ARCH}:1.0
    container_name: system-agent
    restart: unless-stopped
    env_file:
      - .env
    privileged: true
    network_mode: host
    environment:
      DEVICE_AGENT: "${DEVICE_AGENT}"
      LOCATION_LAT: "${LOCATION_LAT}"
      LOCATION_LON: "${LOCATION_LON}"
      WEATHER_TOKEN: "${WEATHER_TOKEN}"
      WEATHER_PLUGIN: "${WEATHER_PLUGIN}"
      MQTT_BROKER: "${MQTT_BROKER}"
    volumes:
      - /sys:/sys:ro
      - /proc:/proc:ro
      - /dev:/dev
