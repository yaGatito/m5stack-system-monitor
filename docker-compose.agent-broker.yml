services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data

  system-agent:
    image: yagatito/system-agent-${PLATFORM_ARCH}:1.0
    container_name: system-agent
    restart: unless-stopped
    env_file:
      - .env
    privileged: true
    network_mode: host
    depends_on:
      mosquitto:
        condition: service_started
    command: sh -c "sleep 15 && ./agent-service"
    volumes:
      - /sys:/sys:ro
      - /proc:/proc:ro
      - /dev:/dev
